services:
  # Base de datos PostgreSQL para n8n y nuestro Backend
  postgres:
    image: postgres:15-alpine
    container_name: sysops-postgres
    restart: always
    environment:
      POSTGRES_USER: sysops_user
      POSTGRES_PASSWORD: sysops_password
      POSTGRES_DB: sysops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Motor de Automatización n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: sysops-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data: